version: 1
frontend:
  phases:
    build:
      commands:
        - python3 scripts/sync_matches.py
        - python3 scripts/build_players.py
        - python3 scripts/build_staff.py
        - python3 scripts/check_site.py
        - node scripts/check_events.cjs
        - node scripts/check_roster.cjs
        - node scripts/check_store.cjs
        - node scripts/check_account.cjs
        - node scripts/check_editor.cjs
        - python3 scripts/package_site.py
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
