name: Check website and rewards
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: pip install -r backend/requirements-test.txt
      - run: python -m unittest discover -s backend -p 'test_*.py'
      - run: cfn-lint -r us-east-1 -t backend/template.yaml
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: |
          python scripts/build_players.py
          python scripts/build_staff.py
          python scripts/check_site.py
          node scripts/check_events.cjs
          node scripts/check_roster.cjs
          node scripts/check_store.cjs
          node scripts/check_account.cjs
          node scripts/check_editor.cjs
          npm run format:check
          npm run build
