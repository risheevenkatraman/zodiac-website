name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check match importer
        run: python -m unittest discover -s scripts -p 'test_sync_matches.py'

      - name: Update FACEIT match schedules
        env:
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
        run: python scripts/sync_matches.py

      - name: Check event data
        run: node scripts/check_events.cjs

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .
          token: ${{ secrets.GITHUB_TOKEN }}
