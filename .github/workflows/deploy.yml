name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: vars.HOSTING_PROVIDER != 'aws'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check match importer
        run: python -m unittest discover -s scripts -p 'test_sync_matches.py'

      - name: Update FACEIT match schedules
        env:
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
        run: python scripts/sync_matches.py

      - name: Check event data
        run: node scripts/check_events.cjs

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Generate and check edited content
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python scripts/build_players.py
          python scripts/build_staff.py
          python scripts/check_site.py
          node scripts/check_roster.cjs
          node scripts/check_store.cjs
          node scripts/check_account.cjs
          node scripts/check_editor.cjs
          npm run build

      - name: Upload synced site
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  refresh-aws:
    if: vars.HOSTING_PROVIDER == 'aws' && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Refresh the AWS site and FACEIT schedule
        env:
          BUILD_WEBHOOK: ${{ secrets.AMPLIFY_BUILD_WEBHOOK }}
        run: curl --fail --silent --show-error --request POST "$BUILD_WEBHOOK" --header 'Content-Type:application/json' --data '{}'
