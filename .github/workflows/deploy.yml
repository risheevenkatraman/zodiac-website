name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check match importer
        run: python -m unittest discover -s scripts -p 'test_sync_matches.py'

      - name: Update FACEIT match schedules
        env:
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
        run: python scripts/sync_matches.py

      - name: Check event data
        run: node scripts/check_events.cjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload synced site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
